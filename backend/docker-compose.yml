services:
  postgres:
    image: postgres:15-alpine
    container_name: aiscalping_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Raise max_connections so all service pools fit comfortably (default=100)
      POSTGRES_INITDB_ARGS: ""
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=512MB
        -c work_mem=4MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: aiscalping_redis
    restart: always
    volumes:
      - redis_data:/data
    # Raise max clients and tune memory for high concurrent bot usage
    command: redis-server --appendonly yes --maxclients 500 --tcp-backlog 511
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: aiscalping-backend
    container_name: aiscalping_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # connection_limit: max DB connections this process opens (Prisma pool)
      # pool_timeout: seconds to wait for a free connection before erroring
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connection_limit=10&pool_timeout=15
    ports:
      - "5000:5000"
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  deposit-worker:
    image: aiscalping-backend
    container_name: aiscalping_deposit_worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      rpc-proxy:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connection_limit=5&pool_timeout=15
    command: node dist/workers/index.js

  sweeper-worker:
    image: aiscalping-backend
    container_name: aiscalping_sweeper
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      rpc-proxy:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connection_limit=5&pool_timeout=15
    command: node dist/workers/sweeperIndex.js

  listener-worker:
    image: aiscalping-backend
    container_name: aiscalping_listener
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      rpc-proxy:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connection_limit=5&pool_timeout=15
    command: node dist/workers/listenerIndex.js

  # ── probot-worker scaled to 3 replicas ─────────────────────────────────────
  # Each replica runs concurrency=30, so 3×30 = 90 simultaneous trade-cycle jobs.
  # Each job now does ~4 DB ops (down from ~10 before log buffering).
  # Connection budget: 3 replicas × 8 connections = 24 DB connections for all bot workers.
  # No container_name — required to allow multiple replicas.
  # ─────────────────────────────────────────────────────────────────────────────
  probot-worker:
    image: aiscalping-backend
    restart: always
    deploy:
      replicas: 3
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 8 connections per replica × 3 replicas = 24 total for bot workers
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connection_limit=8&pool_timeout=15
    command: node dist/workers/proBotWorker.js

  email-worker:
    image: aiscalping-backend
    container_name: aiscalping_email_worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connection_limit=5&pool_timeout=15
    command: node dist/workers/emailWorker.js
  
  rpc-proxy:
    build:
      context: ./rpc-proxy
      dockerfile: Dockerfile
    container_name: aiscalping_rpc_proxy
    restart: always
    env_file:
      - .env
    # Only accessible inside the Docker network — not exposed to internet
    expose:
      - "3099"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3099/health', r => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redis_data: